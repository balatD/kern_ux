<f:layout name="Default" />
<f:section name="Main">

        Deliberately narrow. Long forms and task lists read badly at full width, and
        KERN's form components are designed for a constrained measure.
    </f:comment>
    <div class="kern-container kernt3-content-area">
        <div class="kern-grid kern-grid-cols-1 kern-grid-cols-12-lg">
            <div class="kern-col-12 kern-col-6-lg">
                <f:cObject typoscriptObjectPath="lib.kernUx.content.main" />
            </div>
        </div>
    </div>
</f:section>
