<f:argument name="title" type="string"
/><f:argument name="level" type="int" optional="{true}" default="3"
/><f:argument name="number" type="int" optional="{true}" default="0"
/><f:argument name="editLink" type="string" optional="{true}" default=""
/><f:argument name="editLabel" type="string" optional="{true}" default=""
            description="The edit link needs to name what it edits: several 'Edit' links on one page are indistinguishable out of context (WCAG 2.4.4), which is why the title is appended as screen-reader-only text. Empty uses the translated default."
/><f:variable name="editLabelText" value="{editLabel}"
/><f:if condition="!{editLabelText}"><f:variable name="editLabelText"><f:translate key="summary.edit" extensionName="KernUx" /></f:variable></f:if><f:comment>
    The confirmation step of an application journey. KERN moved the step number inside
    the title wrapper in 2.7.0 so it is part of the heading rather than a floating
    span next to it.
</f:comment><f:spaceless>
<div class="kern-summary">
    <div class="kern-summary__header">
        <div class="kern-summary__title-wrapper">
            <f:if condition="{number}"><span class="kern-number">{number}</span></f:if>
            <k:atom.heading level="{level}" appearance="title">{title}</k:atom.heading>
        </div>
        <f:if condition="{editLink}">
            <k:atom.link href="{editLink}" small="{true}">{editLabelText}<span class="kern-sr-only"> – {title}</span></k:atom.link>
        </f:if>
    </div>
    <div class="kern-summary__body"><f:slot /></div>
</div>
</f:spaceless>
