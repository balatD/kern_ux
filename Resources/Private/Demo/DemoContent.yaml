                                -   type: kernux_descriptionlist
                                    header: 'Nebeneinander'
                                    header_layout: 2
                                    collections:
                                        tx_kernux_descriptionlist_entries:
                                            -   term: 'Gebühr'
                                                definition: '37,00 Euro'
                                            -   term: 'Bearbeitungszeit'
                                                definition: '2 bis 4 Wochen'
                                            -   term: 'Zuständig'
                                                definition: 'Bürgerbüro, Rathausplatz 1'
                                -   type: kernux_descriptionlist
                                    header: 'Untereinander'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_descriptionlist_stacked: 1
                                    collections:
                                        tx_kernux_descriptionlist_entries:
                                            -   term: 'Montag bis Freitag'
                                                definition: '8 bis 12 Uhr'
                                            -   term: 'Donnerstag zusätzlich'
                                                definition: '14 bis 18 Uhr'
                                            -   term: 'Samstag und Sonntag'
                                                definition: 'geschlossen'

                    -   title: 'Trenner'
                        slug: trenner
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Trenner'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Eine Linie ist normalerweise Dekoration und für Screenreader verborgen. Trennt sie zwei Themen, wird sie angekündigt.</p>'
                                -   type: kernux_text
                                    header: 'Dekorativ'
                                    header_layout: 2
                                    fields:
                                        bodytext: '<p>Absatz oberhalb der dekorativen Linie.</p>'
                                -   type: kernux_divider
                                -   type: kernux_text
                                    fields:
                                        bodytext: '<p>Absatz unterhalb der dekorativen Linie.</p>'
                                -   type: kernux_text
                                    header: 'Inhaltlich trennend'
                                    header_layout: 2
                                    fields:
                                        bodytext: '<p>Absatz oberhalb der inhaltlichen Linie.</p>'
                                -   type: kernux_divider
                                    fields:
                                        tx_kernux_divider_semantic: 1
                                -   type: kernux_text
                                    fields:
                                        bodytext: '<p>Absatz unterhalb der inhaltlichen Linie.</p>'

                    -   title: 'Schaltflächen'
                        slug: schaltflaechen
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Schaltflächen'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>KERN erlaubt eine primäre Handlung je Gruppe. Bleibt die Gewichtung auf „Automatisch“, sorgt das Element selbst dafür.</p>'
                                -   type: kernux_buttongroup
                                    collections:
                                        tx_kernux_buttongroup_buttons:
                                            -   label: 'Antrag stellen'
                                                link: '{page:exampleApplication}'
                                            -   label: 'Unterlagen ansehen'
                                                link: '{page:exampleService}'
                                            -   label: 'Abbrechen'
                                                link: '{page:elements}'
                                -   type: kernux_text
                                    header: 'Gewichtung von Hand'
                                    header_layout: 2
                                    fields:
                                        bodytext: '<p>Primär, sekundär und tertiär, ausdrücklich gesetzt.</p>'
                                -   type: kernux_buttongroup
                                    collections:
                                        tx_kernux_buttongroup_buttons:
                                            -   label: 'Primär'
                                                link: '{page:elements}'
                                                variant: primary
                                            -   label: 'Sekundär'
                                                link: '{page:elements}'
                                                variant: secondary
                                            -   label: 'Tertiär'
                                                link: '{page:elements}'
                                                variant: tertiary

                    -   title: 'Akkordeon'
                        slug: akkordeon
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Akkordeon'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Aufklappbare Abschnitte über das native <code>details</code>-Element, also ohne eigenes JavaScript und mit Tastaturbedienung aus dem Browser.</p>'
                                -   type: kernux_accordion
                                    header: 'Häufige Fragen'
                                    header_layout: 2
                                    collections:
                                        tx_kernux_accordion_panels:
                                            -   title: 'Ein Abschnitt, der beim Laden offen ist'
                                                expanded: 1
                                                text: '<p>Höchstens einer sollte das sein, sonst hebt sich der Zweck des Akkordeons auf.</p>'
                                            -   title: 'Ein geschlossener Abschnitt'
                                                text: |
                                                    <p>Mit Fließtext, einer Liste und einem Link:</p>
                                                    <ul><li>erster Punkt</li><li>zweiter Punkt</li></ul>
                                            -   title: 'Ein dritter Abschnitt'
                                                text: '<p>Zwei Akkordeons nebeneinander brauchen keinen Gruppen-Wrapper - KERN setzt sie über einen Geschwisterselektor ab.</p>'
                                -   type: kernux_accordion
                                    header: 'Ein zweites Akkordeon'
                                    header_layout: 2
                                    collections:
                                        tx_kernux_accordion_panels:
                                            -   title: 'Abstand zum Akkordeon darüber'
                                                text: '<p>Kommt aus dem CSS, nicht aus einem zusätzlichen Element.</p>'

                    -   title: 'Hinweis'
                        slug: hinweis
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Hinweis'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Alle vier Arten. Die Art bestimmt Farbe und Symbol und ist nach der Bedeutung zu wählen, nicht nach der gewünschten Aufmerksamkeit.</p>'
                                -   type: kernux_alert
                                    header: 'Information'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_alert_variant: info
                                        bodytext: '<p>Das Bürgerbüro ist am 24. Dezember geschlossen.</p>'
                                -   type: kernux_alert
                                    header: 'Erfolg'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_alert_variant: success
                                        bodytext: '<p>Ihr Antrag ist eingegangen. Sie erhalten eine Bestätigung per E-Mail.</p>'
                                -   type: kernux_alert
                                    header: 'Warnung'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_alert_variant: warning
                                        bodytext: '<p>Ohne biometrisches Passbild kann der Antrag nicht bearbeitet werden.</p>'
                                -   type: kernux_alert
                                    header: 'Fehler'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_alert_variant: danger
                                        bodytext: '<p>Die Online-Terminbuchung ist derzeit nicht erreichbar. Bitte rufen Sie an.</p>'

                    -   title: 'Karten'
                        slug: karten
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Karten'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Die Spaltenzahl ist eine Obergrenze für breite Bildschirme; schmale Bildschirme zeigen immer eine Karte je Zeile.</p>'
                                -   type: kernux_cardgrid
                                    header: 'Drei Spalten, mit Bild'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_cardgrid_columns: 3
                                    collections:
                                        tx_kernux_cardgrid_cards:
                                            -   title: 'Personalausweis'
                                                preline: 'Dienstleistung'
                                                text: 'Erstausstellung, Verlängerung und Ersatz nach Verlust.'
                                                link: '{page:exampleService}'
                                                image: ausweis
                                            -   title: 'Rathaus'
                                                preline: 'Standort'
                                                text: 'Rathausplatz 1, barrierefrei erreichbar.'
                                                link: '{page:exampleHome}'
                                                image: rathaus
                                            -   title: 'Stadtpark'
                                                preline: 'Freizeit'
                                                text: 'Öffnungszeiten und Veranstaltungen.'
                                                link: '{page:elements}'
                                                image: stadtpark
                                -   type: kernux_cardgrid
                                    header: 'Zwei Spalten, ohne Bild'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_cardgrid_columns: 2
                                    collections:
                                        tx_kernux_cardgrid_cards:
                                            -   title: 'Eine Karte ohne Link'
                                                text: 'Ohne Ziel ist die Karte kein Link, sondern nur ein Container.'
                                            -   title: 'Eine Karte mit Link'
                                                text: 'Mit Ziel wird die ganze Karte anklickbar.'
                                                link: '{page:elements}'
                                -   type: kernux_cardgrid
                                    header: 'Vier Spalten'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_cardgrid_columns: 4
                                    collections:
                                        tx_kernux_cardgrid_cards:
                                            -   title: 'Bauen'
                                                link: '{page:elements}'
                                            -   title: 'Umwelt'
                                                link: '{page:elements}'
                                            -   title: 'Soziales'
                                                link: '{page:elements}'
                                            -   title: 'Verkehr'
                                                link: '{page:elements}'

                    -   title: 'Fortschritt'
                        slug: fortschritt
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Fortschritt'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Die Beschriftung trägt die Information. Ein Balken allein sagt nichts aus, deshalb ist sie ein Pflichtfeld.</p>'
                                -   type: kernux_progress
                                    fields:
                                        tx_kernux_progress_label: 'Schritt 1 von 4: Angaben zur Person'
                                        tx_kernux_progress_value: 1
                                        tx_kernux_progress_max: 4
                                -   type: kernux_progress
                                    fields:
                                        tx_kernux_progress_label: 'Schritt 3 von 4: Angaben prüfen'
                                        tx_kernux_progress_value: 3
                                        tx_kernux_progress_max: 4
                                -   type: kernux_progress
                                    fields:
                                        tx_kernux_progress_label: 'Schritt 4 von 4: Abgeschlossen'
                                        tx_kernux_progress_value: 4
                                        tx_kernux_progress_max: 4

                    -   title: 'Aufgabenübersicht'
                        slug: aufgabenuebersicht
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Aufgabenübersicht'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Die Schritte eines Antrags mit Status. Ein Schritt ohne Ziel erscheint als Text statt als toter Link - so sieht ein noch nicht startbarer Schritt aus.</p>'
                                -   type: kernux_tasklist
                                    header: 'Nummeriert'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_tasklist_numbered: 1
                                    collections:
                                        tx_kernux_tasklist_steps:
                                            -   title: 'Unterlagen zusammenstellen'
                                                status: 'Erledigt'
                                                statusVariant: success
                                                link: '{page:exampleService}'
                                            -   title: 'Antrag ausfüllen'
                                                status: 'In Bearbeitung'
                                                statusVariant: info
                                                link: '{page:exampleApplication}'
                                            -   title: 'Termin wahrnehmen'
                                                status: 'Offen'
                                                statusVariant: warning
                                            -   title: 'Ausweis abholen'
                                                status: 'Noch nicht möglich'
                                                statusVariant: danger
                                -   type: kernux_tasklist
                                    header: 'Ohne Nummerierung'
                                    header_layout: 2
                                    fields:
                                        # Set rather than omitted: this field's TCA default is 1, and the two
                                        # majors disagree about whether a field left out of a new record gets
                                        # its default - TYPO3 14 applies it, 13 stores 0. Anything the fixture
                                        # actually means has to be written down.
                                        tx_kernux_tasklist_numbered: 0
                                    collections:
                                        tx_kernux_tasklist_steps:
                                            -   title: 'Wohnsitz anmelden'
                                                status: 'Erledigt'
                                                statusVariant: success
                                                link: '{page:exampleService}'
                                            -   title: 'Rundfunkbeitrag anmelden'
                                                status: 'Offen'
                                                statusVariant: warning

                    -   title: 'Dialog'
                        slug: dialog
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Dialog'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: |
                                            <p>Der einzige Inhaltstyp, der eigenes JavaScript braucht. Er nutzt das
                                            native <code>showModal()</code>, sodass Fokusfalle, Inertheit des
                                            Hintergrunds, Escape und Fokusrückgabe vom Browser kommen.</p>
                                            <p>Zum Prüfen: mit der Tastatur öffnen, durchtabben, mit Escape schließen -
                                            der Fokus muss auf der auslösenden Schaltfläche landen.</p>
                                -   type: kernux_dialog
                                    header: 'Gebühren im Detail'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_dialog_triggerLabel: 'Gebühren anzeigen'
                                        tx_kernux_dialog_triggerVariant: secondary
                                        bodytext: |
                                            <p>Die Gebühr richtet sich nach dem Alter zum Zeitpunkt der
                                            Antragstellung.</p>
                                            <ul>
                                                <li>ab 24 Jahren: 37,00 Euro</li>
                                                <li>unter 24 Jahren: 22,80 Euro</li>
                                                <li>vorläufiger Ausweis: 10,00 Euro</li>
                                            </ul>
                                -   type: kernux_dialog
                                    header: 'Antrag wirklich abbrechen?'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_dialog_triggerLabel: 'Antrag abbrechen'
                                        tx_kernux_dialog_triggerVariant: tertiary
                                        bodytext: '<p>Ihre Eingaben werden dabei nicht gespeichert.</p>'

                    -   title: 'Bild'
                        slug: bild
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Bild'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Die Bildunterschrift ist für alle sichtbar und ersetzt den Alternativtext nicht - der wird an der Datei selbst gepflegt.</p>'
                                -   type: kernux_image
                                    header: 'Mit Bildunterschrift'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_image_caption: 'Das Rathaus wurde 1894 errichtet und 2019 barrierefrei umgebaut.'
                                    files:
                                        tx_kernux_image_image:
                                            -   key: rathaus
                                -   type: kernux_image
                                    header: 'Ohne Bildunterschrift'
                                    header_layout: 2
                                    files:
                                        tx_kernux_image_image:
                                            -   key: stadtpark

                    -   title: 'Bildergalerie'
                        slug: bildergalerie
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Bildergalerie'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Mehrere Bilder in einem Gitter, Spaltenzahl als Obergrenze für breite Bildschirme.</p>'
                                -   type: kernux_gallery
                                    header: 'Drei Spalten'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_gallery_columns: 3
                                    files:
                                        tx_kernux_gallery_images:
                                            -   key: rathaus
                                            -   key: buergerbuero
                                            -   key: stadtpark
                                            -   key: baustelle
                                            -   key: ausweis
                                -   type: kernux_gallery
                                    header: 'Zwei Spalten'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_gallery_columns: 2
                                    files:
                                        tx_kernux_gallery_images:
                                            -   key: stadtpark
                                            -   key: rathaus

                    -   title: 'Video oder Audio'
                        slug: video-oder-audio
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Video oder Audio'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: |
                                            <p>Bewusst der native Player mit <code>controls</code>: ein eigener Player
                                            würde bedeuten, Tastaturbedienung, Fokusverwaltung und Beschriftung für
                                            jedes Bedienelement neu zu bauen - der Browser liefert das schon richtig.</p>
                                            <p>Untertitel sind für jede Aufnahme mit Sprache Pflicht (WCAG 1.2.2), ein
                                            Transkript für rein auditive Inhalte (WCAG 1.2.1).</p>
                                -   type: kernux_media
                                    header: 'Audio mit Untertiteln und Transkript'
                                    header_layout: 2
                                    fields:
                                        tx_kernux_media_audio: 1
                                        tx_kernux_media_transcript: |
                                            Das Bürgerbüro der Stadt Musterstadt ist montags bis freitags von 8 bis 12 Uhr
                                            geöffnet, donnerstags zusätzlich von 14 bis 18 Uhr.

                                            Am 24. und 31. Dezember bleibt das Bürgerbüro geschlossen.
                                    files:
                                        tx_kernux_media_file:
                                            -   key: ansage
                                        tx_kernux_media_captions:
                                            -   key: ansage-untertitel

                    -   title: 'Downloads'
                        slug: downloads
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Downloads'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Format und Größe kommen aus der Datei selbst und können deshalb nicht veralten. Ein Titel an der Datei wird als Linktext genutzt.</p>'
                                -   type: kernux_downloads
                                    header: 'Unterlagen zum Personalausweis'
                                    header_layout: 2
                                    files:
                                        tx_kernux_downloads_files:
                                            -   key: antrag
                                                description: 'Zum Ausfüllen am Rechner vorbereitet.'
                                            -   key: merkblatt
                                                description: 'Anforderungen an das Passbild, mit Beispielen.'

                    -   title: 'Inhaltsverzeichnis'
                        slug: inhaltsverzeichnis
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Inhaltsverzeichnis'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Wird aus den Inhaltselementen der Seite gebaut, kann also nicht auseinanderlaufen. Elemente mit verborgener Überschrift werden übersprungen, weil ein Link dorthin ins Leere führen würde.</p>'
                                -   type: kernux_toc
                                    header: 'Auf dieser Seite'
                                    header_layout: 2
                                -   type: kernux_text
                                    header: 'Erster Abschnitt'
                                    header_layout: 2
                                    fields:
                                        bodytext: '<p>Erscheint im Verzeichnis darüber.</p>'
                                -   type: kernux_text
                                    header: 'Zweiter Abschnitt'
                                    header_layout: 2
                                    fields:
                                        bodytext: '<p>Erscheint ebenfalls im Verzeichnis.</p>'
                                -   type: kernux_text
                                    header: 'Dieser Abschnitt hat eine verborgene Überschrift'
                                    header_layout: 100
                                    fields:
                                        bodytext: '<p>Weil die Überschrift verborgen ist, fehlt dieser Abschnitt im Verzeichnis - genau so soll es sein.</p>'

                    -   title: 'Sitemap'
                        slug: sitemap
                        layout: default
                        content:
                            main:
                                -   type: kernux_text
                                    header: 'Sitemap'
                                    header_layout: 1
                                    fields:
                                        tx_kernux_heading_appearance: x-large
                                        bodytext: '<p>Verzeichnis der Unterseiten. Ohne gesetzte Startseite werden die Unterseiten der aktuellen Seite aufgelistet.</p>'
                                -   type: kernux_sitemap
                                    header: 'Unterseiten von Beispielseiten'
                                    header_layout: 2
                                    refs:
                                        tx_kernux_sitemap_startPage: examples
                                -   type: kernux_sitemap
                                    header: 'Unterseiten von Elemente'
                                    header_layout: 2
                                    refs:
                                        tx_kernux_sitemap_startPage: elements

