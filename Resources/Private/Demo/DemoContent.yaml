                                    header_layout: 2
                                    fields:
                                        tx_kernux_list_variant: number
                                    collections:
                                        tx_kernux_list_items:
                                            -   text: 'Unterlagen zusammenstellen'
                                            -   text: 'Termin buchen'
                                                link: '{page:exampleApplication}'
                                            -   text: 'Antrag persönlich stellen'

                    -   title: 'Definitionsliste'
                        slug: definitionsliste
