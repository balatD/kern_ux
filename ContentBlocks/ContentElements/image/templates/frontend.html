<f:comment>
    Alternative text and caption come from the file reference itself, so the same image
    keeps its description wherever it is reused. The checkbox turns off lazy loading
    for an image at the top of the page - lazy loading delays exactly those.
</f:comment><k:molecule.section
    spaceBefore="{data.space_before_class}"
    spaceAfter="{data.space_after_class}"
    id="{kux:uniqueId(prefix: 'content', uid: data.uid)}"
><k:molecule.contentHeader
    header="{data.header}"
    layout="{data.header_layout}"
    appearance="{data.tx_kernux_heading_appearance}"
/><f:if condition="{data.tx_kernux_image_image.0}"><k:molecule.figure
    image="{data.tx_kernux_image_image.0}"
    caption="{data.tx_kernux_image_caption}"
    lazy="{f:if(condition: data.tx_kernux_image_aboveTheFold, then: 0, else: 1)}"
/></f:if></k:molecule.section>
